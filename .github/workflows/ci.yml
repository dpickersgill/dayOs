# Checks every change before it can be released [security review M7]: the full test suite against a real MySQL,
# known-vulnerable packages, and CodeQL's security scan of the code. Runs when this folder is pushed to GitHub.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, so a newly published package problem is found even without a change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: summitops_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: summitops_test
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known-vulnerable packages
        run: npm audit --omit=dev --audit-level=high
      - run: npm run migrate
      - run: npm test
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
