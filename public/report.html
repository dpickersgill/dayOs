<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Report a problem</title>
  <style>
    @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; font-display: optional; src: url(/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; font-display: optional; src: url(/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2'); }
    :root { --focus: #1e2d3a; --bg: #f4f6f7; --card: #fff; --ink: #14202b; --ink2: #3c4a56; --line: #8a98a5; --slate: #1e2d3a; --spruce: #1f5a4a; --gold: #d8b672; --red: #b3261e; --ok: #1f6b3a; --tint: #e7efec; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --focus: #d8b672; --bg: #0f171e; --card: #17232d; --ink: #f1f4f6; --ink2: #c4cdd4; --line: #6d7c88; --tint: #1c3029; --ok: #7fd49b; } }
    :root[data-theme="dark"] { --focus: #d8b672; --bg: #0f171e; --card: #17232d; --ink: #f1f4f6; --ink2: #c4cdd4; --line: #6d7c88; --tint: #1c3029; --ok: #7fd49b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1.125rem/1.45 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--slate); color: #fff; }
    .bar-q { font-weight: 700; flex: 1; line-height: 1.2; }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
    h1, h2 { line-height: 1.15; margin: 8px 0 12px; } h1 { font-size: 1.75rem; } h2 { font-size: 1.35rem; } h1:focus, h2:focus { outline: none; }
    p { margin: 8px 0; } .muted { color: var(--ink2); } .small { font-size: 1rem; }
    .org { margin: 4px 0 0; font-weight: 700; color: var(--ink2); }
    .b { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; margin: 10px 0; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--slate);
      background: var(--card); color: var(--ink); font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; touch-action: manipulation; }
    .b:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .bar .b:focus-visible { outline-color: #fff; }
    .pri { background: var(--slate); color: #fff; } .b[disabled] { opacity: .6; }
    .b911 { width: auto; min-height: 48px; margin: 0; padding: 6px 14px; background: var(--gold); border-color: var(--gold); color: #14202b; }
    .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin: 12px 0; } .grid .b { margin: 0; min-height: 64px; font-weight: 400; }
    .grid .b[aria-pressed="true"] { background: var(--slate); color: #fff; font-weight: 700; }
    input, select, textarea { width: 100%; font: inherit; min-height: 52px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
    textarea { min-height: 96px; }
    label { display: block; font-weight: 700; margin-top: 12px; } label .muted { font-weight: 400; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; } .check input { width: 28px; min-height: 28px; flex: none; margin-top: 2px; }
    .note { border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px; margin: 12px 0; background: var(--card); }
    .got { background: var(--tint); border-left: 6px solid var(--ok); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
    .err { color: var(--red); font-weight: 700; }
    .ref { font-size: 2.25rem; font-weight: 700; letter-spacing: .04em; margin: 4px 0; }
    .steps { color: var(--ink2); font-size: 1rem; margin: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; } .row .b { flex: 1 1 10rem; width: auto; }
    .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; } .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .tl { list-style: none; padding: 0; margin: 8px 0; } .tl li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <header class="bar" id="bar"><span class="bar-q">For an emergency, call 911.</span><a class="b b911" href="tel:911">Call 911</a></header>
  <main id="app">
    <p id="loading">Loading…</p>
  </main>
  <noscript><p style="max-width:560px;margin:16px auto;padding:0 16px;font-weight:700">This page needs JavaScript. To report a problem, call the municipal office. For an emergency, call 911.</p></noscript>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
